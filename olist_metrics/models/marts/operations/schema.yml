version: 2

models:
  - name: fct_deliveries
    description: "Order-level delivery performance fact table. One row per order."
    columns:
      - name: order_id
        description: "Unique order identifier."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "True customer identifier."
        tests:
          - not_null
      - name: order_status
        description: "Order lifecycle status."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']
      - name: delivery_status
        description: "Derived delivery status: early, on_time, late or unknown."
        tests:
          - accepted_values:
              arguments:
                values: ['early', 'on_time', 'late', 'unknown']

  - name: fct_seller_performance
    description: "Seller performance metrics by month. One row per seller per month."
    columns:
      - name: seller_id
        description: "Unique seller identifier."
        tests:
          - not_null
      - name: order_month
        description: "Month of activity."
        tests:
          - not_null
      - name: total_revenue
        description: "Total revenue generated by the seller in BRL."
        tests:
          - not_null:
              config:
                severity: warn